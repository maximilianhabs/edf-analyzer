name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Schnell und ohne schwere Abhängigkeiten: die drei Konsistenz-Prüfer brauchen nur die
  # Standardbibliothek. Läuft deshalb als eigener Job, der in Sekunden ein Ergebnis liefert,
  # statt auf die MNE/SciPy-Installation zu warten.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Übersetzungen vollständig und konsistent
        run: python3 tools/check_i18n.py
      - name: Schriften auflösbar, kein CDN
        run: python3 tools/check_fonts.py
      - name: Methoden-Registry, Belege und READMEs konsistent
        run: python3 tools/check_methods.py
      # Ratsche gegen strukturellen Rückfall: bekannte Schichtverletzungen sind namentlich
      # geduldet, neue nicht. Die Liste kann nur kürzer werden.
      - name: Schichten (analysis/ ohne UI-Abhängigkeit)
        run: python3 tools/check_layering.py
      # Linter am Ende des schnellen Jobs: bewusst schmale Regelauswahl (siehe ruff.toml),
      # damit die Meldungen etwas bedeuten und nicht pauschal weggeklickt werden.
      - name: Linter (ruff)
        run: |
          pip install ruff
          ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 ist seit August 2026 die Zielversion und entspricht dem Dockerfile.
        # Vorher lief hier zusätzlich 3.9; das war die Version des Images, bis
        # Python 3.9 sein Lebensende erreichte. Eine zweite Version (3.13) als
        # Vorwarnung wäre sinnvoll, sobald die Abhängigkeiten sie tragen.
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # Läuft OHNE EDF_TEST_FILE: die Suite muss allein mit den synthetischen Fixtures im
      # Repo auskommen. Genau das war vorher nicht der Fall — die Tests hingen an einer
      # echten Aufnahme auf dem Rechner des Autors und waren für niemanden sonst lauffähig.
      - run: pytest tests/ -v
      # Lizenzprüfung erst NACH der Installation: sie liest die Lizenzen aus den Metadaten
      # der tatsächlich installierten Pakete, nicht aus einer gepflegten Liste.
      - name: Abhängigkeiten und Lizenzen konsistent
        run: python3 tools/check_licenses.py
