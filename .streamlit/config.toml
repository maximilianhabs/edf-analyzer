[theme]
# Design-System Phase 0 (2026-08-08, siehe [[project_edf_ui_redesign]]) — Werte gespiegelt aus
# core/design_tokens.py (ACCENT/BG_SUBTLE/TEXT_PRIMARY). Bei Änderung dort auch hier nachziehen.
base = "light"
primaryColor = "#0071e3"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f5f7"
textColor = "#1d1d1f"
font = "sans serif"

[browser]
# Streamlit sendet sonst Nutzungsstatistiken an einen externen Dienst
# (webhooks.fivetran.com) — bei einer App, die EEG-Aufnahmen verarbeitet, nicht vertretbar.
gatherUsageStats = false

[server]
runOnSave = true
# Liefert ./static/ unter /app/static/ aus — nötig für die selbst gehosteten Schriften
# (static/fonts/Inter-*.woff2). Ohne diese Zeile liefert Streamlit 404 und die Oberfläche
# fällt still auf Streamlits eigene Schrift zurück, ohne sichtbaren Fehler.
enableStaticServing = true
# maxUploadSize begrenzt nur die Datei auf der Festplatte, NICHT den RAM-Bedarf im
# Container: load_and_prepare() hält die Rohdaten als float64-Arrays (mehrfach kopiert
# beim Laden/Filtern), das ist deutlich größer als die Dateigröße. Faustregel (empirisch,
# Audit 2026-07-04): eine typische mehrkanalige 10-Minuten-Aufnahme braucht ~180 MB RAM
# pro aktiver Session — bei mehreren gleichzeitigen Sessions multipliziert sich das linear.
# Kein hartes RAM-Limit im Code hinterlegt; auf dem VPS ggf. über Docker-Limits absichern.
maxUploadSize = 200
